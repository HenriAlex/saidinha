<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Define a codificação dos caracteres da página. -->
    <meta charset="UTF-8">
    <!-- Permite que a página se adapte a celulares e computadores. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título exibido na aba do navegador. -->
    <title>Saidinha</title>
    <!-- Importa o arquivo responsável pelo estilo da página. -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Cabeçalho principal da aplicação. -->
    <header>
        <!-- Nome do sistema. -->
        <h1>Saidinha</h1>
        <!-- Descrição do sistema. -->
        <p>Controle de saídas dos alunos</p>
    </header>

    <!-- Área principal da aplicação. -->
    <main>
        <!-- Seção de apresentação. -->
        <section class="card">
            <!-- Título da seção. -->
            <h2>Bem-vindo!</h2>
            <!-- Texto explicativo. -->
            <p>
                Sistema para controle e acompanhamento
                das saídas dos alunos durante as aulas.
            </p>
            <!-- Botão utilizado para testar o JavaScript. -->
            <button onclick="mostrarMensagem()">
                Testar sistema
            </button>
        </section>
    </main>
    <!-- Rodapé da aplicação. -->
    <footer>
        <p>
            Saidinha - Projeto TCC
        </p>
    </footer>
    <!-- Importa o arquivo JavaScript. -->
    <script src="script.js"></script>
</body>
</html>
